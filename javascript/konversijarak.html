<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Konversi Satuan</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Comic Sans MS", "Comic Sans", cursive, sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;

      background: url('bg/rainbow.jpg') no-repeat center center/cover;
    }

    .header {
      text-align: center;
      color: black;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 32px;
      margin-bottom: 5px;
    }

    .header p {
      font-size: 18px;
      opacity: 0.8;
    }

    .container {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      padding: 25px;
      border-radius: 20px;
      width: 320px;
      text-align: center;

      box-shadow: 0 10px 30px rgba(0,0,0,0.5);

      transition: 0.3s;
    }

    .container:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 40px rgba(0,0,0,0.7);
    }

    select, input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 10px;
      border: none;
      outline: none;
      font-size: 16px;
    }

    input {
      text-align: center;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 10px;
      border: none;
      background: #835744;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #c1ab7c;
      transform: scale(1.05);
    }

    .result {
      margin-top: 15px;
      color: black;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>Konversi Satuan Meter & Kilometer</h1>
    <p><b>
	Nadya Naylaturrahmah - 2507411051<br>
	Zhafira Safahasna Labibah - 2507411046
	</b></p>
  </div>

  <div class="container">
    <input type="number" id="value" placeholder="Masukkan nilai">

    <select id="mode">
      <option value="mToKm">Meter ke Kilometer</option>
      <option value="kmToM">Kilometer ke Meter</option>
    </select>

    <button onclick="convert()">Konversi</button>

    <div class="result" id="result"></div>
  </div>

  <script>
    function convert() {
      let value = parseFloat(document.getElementById("value").value);
      let mode = document.getElementById("mode").value;
      let result;

      if (isNaN(value)) {
        document.getElementById("result").innerText = "Masukkan angka dulu!";
        return;
      }

      if (mode === "mToKm") {
        result = value / 1000;
        document.getElementById("result").innerText =
          `${value} meter = ${result} kilometer`;
      } else {
        result = value * 1000;
        document.getElementById("result").innerText =
          `${value} kilometer = ${result} meter`;
      }
    }
  </script>

</body>
</html>
